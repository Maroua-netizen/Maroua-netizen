<svg fill="none" viewBox="0 0 800 250" width="800" height="250" xmlns="http://www.w3.org/2000/svg">
	<foreignObject width="100%" height="100%">
		<div xmlns="http://www.w3.org/1999/xhtml">
			<style>
				@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&amp;display=swap');

				.container {
					font-family: 'Fira Code', monospace;
					width: 100%;
					height: 250px;
					background-color: #0d1117; /* GitHub Dark Bg */
					background-image: 
						radial-gradient(circle at 10% 20%, rgba(255, 20, 147, 0.1) 0%, transparent 20%),
						radial-gradient(circle at 90% 80%, rgba(255, 20, 147, 0.1) 0%, transparent 20%);
					display: flex;
					flex-direction: column;
					justify-content: center;
					align-items: flex-start;
					padding: 40px;
					box-sizing: border-box;
					position: relative;
					overflow: hidden;
					border-radius: 10px;
					border: 1px solid rgba(255, 20, 147, 0.3);
				}

				/* Circuit lines */
				.line {
					position: absolute;
					background: rgba(255, 20, 147, 0.4);
					box-shadow: 0 0 10px rgba(255, 20, 147, 0.6);
				}
				.l1 { top: 20%; left: -10%; width: 40%; height: 2px; animation: moveRight 8s linear infinite; }
				.l2 { bottom: 30%; right: -10%; width: 30%; height: 2px; animation: moveLeft 6s linear infinite; }
				.l3 { top: -10%; right: 20%; width: 2px; height: 50%; animation: moveDown 10s linear infinite; }

				@keyframes moveRight { 0% { left: -20%; opacity: 0;} 50% { opacity: 1; } 100% { left: 100%; opacity: 0;} }
				@keyframes moveLeft { 0% { right: -20%; opacity: 0;} 50% { opacity: 1; } 100% { right: 100%; opacity: 0;} }
				@keyframes moveDown { 0% { top: -20%; opacity: 0;} 50% { opacity: 1; } 100% { top: 100%; opacity: 0;} }

				h1 {
					font-size: 48px;
					font-weight: 700;
					margin: 0;
					color: #fff;
					text-shadow: 
						0 0 5px #fff,
						0 0 10px #fff,
						0 0 20px #ff1493,
						0 0 40px #ff1493,
						0 0 80px #ff1493;
					animation: flicker 3s infinite alternate;
				}

				@keyframes flicker {
					0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
						text-shadow: 
						0 0 5px #fff,
						0 0 10px #fff,
						0 0 20px #ff1493,
						0 0 40px #ff1493,
						0 0 80px #ff1493;
					}
					20%, 24%, 55% {
						text-shadow: none; opacity: 0.8;
					}
				}

				.tagline-container {
					font-size: 20px;
					color: #e0e0e0;
					margin-top: 15px;
					height: 30px;
					overflow: hidden;
					position: relative;
				}

				.tagline-wrapper {
					position: absolute;
					top: 0;
					left: 0;
					animation: cycleText 12s cubic-bezier(0.25, 0.1, 0.25, 1.0) infinite;
				}

				.tagline-item {
					height: 30px;
					display: flex;
					align-items: center;
					white-space: nowrap;
				}

				.highlight {
					color: #ff1493;
					font-weight: bold;
					margin-left: 8px;
					text-shadow: 0 0 10px rgba(255, 20, 147, 0.8);
				}

				/* Cycling Animation */
				@keyframes cycleText {
					0%, 20% { transform: translateY(0px); }
					25%, 45% { transform: translateY(-30px); }
					50%, 70% { transform: translateY(-60px); }
					75%, 95% { transform: translateY(-90px); }
					100% { transform: translateY(0px); }
				}
			</style>
			<div class="container">
				<div class="line l1"></div>
				<div class="line l2"></div>
				<div class="line l3"></div>
				<h1>Hi, I'm Maroua.</h1>
				<div class="tagline-container">
					<div class="tagline-wrapper">
						<div class="tagline-item">
							&gt; 1337 (42 Network) Computer Science Student <span class="highlight">👩‍💻</span>
						</div>
						<div class="tagline-item">
							&gt; From Political Science to <span class="highlight">Systems Programming ⚙️</span>
						</div>
						<div class="tagline-item">
							&gt; Focused on Applied AI &amp; <span class="highlight">Robust Backends 🚀</span>
						</div>
						<div class="tagline-item">
							&gt; "Still debugging — but now building real systems." <span class="highlight">💪</span>
						</div>
					</div>
				</div>
			</div>
		</div>
	</foreignObject>
</svg>
